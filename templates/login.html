<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #1e293b;
            --secondary-color: #0f766e;
            --accent-color: #06b6d4;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 25%, #0f766e 75%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 24px;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(15,118,110,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(6,182,212,0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 20px;
            padding: 24px 36px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: white;
            font-size: 1.3rem;
            transform: rotate(-5deg);
            transition: 0.3s ease;
        }

        .login-container:hover .icon-circle {
            transform: rotate(0deg) scale(1.05);
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 2px;
        }

        .login-header p {
            font-size: 0.8rem;
            color: #64748b;
            margin: 0;
        }

        /* FORM */

        .form-floating {
            margin-bottom: 10px;
        }

        .form-control {
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            padding: 12px 16px;
            height: 50px;
            background-color: #f8fafc;
            font-size: 0.9rem;
            transition: 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(6,182,212,0.1);
            background: white;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #94a3b8;
            padding: 6px;
            z-index: 10;
        }

        .password-toggle:hover {
            color: var(--secondary-color);
        }

        /* BUTTON */

        .btn-login {
            background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
            border: none;
            border-radius: 12px;
            padding: 10px 24px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s ease;
            box-shadow: 0 6px 14px rgba(15,118,110,0.25);
            width: fit-content;
            min-width: 130px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(15,118,110,0.35);
        }

        /* ALERT */

        .alert {
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-danger {
            background: #fef2f2;
            color: #991b1b;
        }

        /* DEMO SECTION */

        .demo-info {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 16px;
        }

        .demo-info strong {
            display: block;
            text-align: center;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .demo-item {
            background: white;
            padding: 4px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #f1f5f9;
            font-size: 0.7rem;
            color: #475569;
        }

        /* FOOTER */

        .login-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .login-footer a {
            color: var(--secondary-color);
            font-weight: 600;
            text-decoration: none;
        }

        /* MOBILE */

        @media (max-width: 480px) {
            .login-container {
                padding: 20px 18px;
            }
            .btn-login {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="login-header">
        <div class="icon-circle">
            <i class="fas fa-boxes"></i>
        </div>
        <h1>Inventory System</h1>
        <p>Asset Management & Tracking</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ message }}</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" id="loginForm">
        {% csrf_token %}

        <div class="form-floating">
            <input type="text" class="form-control" id="id_username" name="username" placeholder="Username" required autofocus>
            <label for="id_username">Username</label>
        </div>

        <div class="form-floating position-relative">
            <input type="password" class="form-control" id="id_password" name="password" placeholder="Password" required>
            <label for="id_password">Password</label>
            <button type="button" id="togglePassword" class="password-toggle">
                <i class="fas fa-eye"></i>
            </button>
        </div>

        <button type="submit" class="btn btn-login" id="submitBtn">
            <span>Sign In</span>
            <i class="fas fa-arrow-right"></i>
        </button>
    </form>

    <div class="demo-info">
        <strong>Quick Access Demo</strong>
        <div class="demo-grid">
            <div class="demo-item">Admin</div>
            <div class="demo-item">Manager</div>
            <div class="demo-item">Viewer</div>
        </div>
        <p class="text-center mt-3 mb-0" style="font-size:0.75rem;color:#94a3b8;">
            Password: <code>password</code>
        </p>
    </div>

    <div class="login-footer">
        <p class="mb-1">&copy; 2026 Inventory System</p>
        <p class="mb-1">Created by <a href="https://abdulrehmansarwar.vercel.app" target="_blank">Abdul Rehman</a></p>
        <p style="font-size:0.7rem;">ID: bc220208440</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const toggle = document.getElementById('togglePassword');
    const pwd = document.getElementById('id_password');
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    if (toggle && pwd) {
        toggle.addEventListener('click', function() {
            const isText = pwd.type === 'text';
            pwd.type = isText ? 'password' : 'text';
            this.innerHTML = isText
                ? '<i class="fas fa-eye"></i>'
                : '<i class="fas fa-eye-slash"></i>';
        });
    }

    if (form && submitBtn) {
        form.addEventListener('submit', function() {
            submitBtn.disabled = true;
            submitBtn.innerHTML =
                '<span class="spinner-border spinner-border-sm"></span> Signing In...';
        });
    }
</script>

</body>
</html>
