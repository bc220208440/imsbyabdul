<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e293b;
            --secondary-color: #0f766e;
            --accent-color: #06b6d4;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 25%, #0f766e 75%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(15, 118, 110, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            width: 90%;
            max-width: 420px;
            padding: 32px;
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-header h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 1.75rem;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 0;
        }

        .form-floating {
            margin-bottom: 16px;
        }

        .form-control {
            border: 1.5px solid #e2e8f0;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            height: 58px; /* Fixed height for consistency */
            background-color: #f8fafc;
        }

        .form-control::placeholder {
            color: #cbd5e1;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
            background-color: #ffffff;
        }

        .form-floating > .form-control:focus,
        .form-floating > .form-control:not(:placeholder-shown) {
            padding-top: 1.625rem;
            padding-bottom: 0.625rem;
        }

        .form-floating > label {
            color: #64748b;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 1rem 0.75rem;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--accent-color) 100%);
            color: white;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 118, 110, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            border: none;
            border-left: 4px solid;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
            border-left-color: var(--danger-color);
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--accent-color) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: white;
            font-size: 1.6rem;
            box-shadow: 0 8px 16px rgba(15, 118, 110, 0.3);
        }

        .login-footer {
            text-align: center;
            margin-top: 14px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .login-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        .demo-info {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-left: 4px solid var(--accent-color);
            padding: 16px;
            border-radius: 10px;
            margin-top: 24px;
            font-size: 0.8rem;
        }

        .demo-info strong {
            color: var(--primary-color);
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        .demo-info small {
            color: #475569;
            line-height: 1.4;
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                max-width: 95%;
            }

            .login-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="icon-circle">
                <i class="fas fa-boxes"></i>
            </div>
            <h1>Inventory System</h1>
            <p>Asset Management & Tracking</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Error!</strong> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" id="loginForm">
            {% csrf_token %}
            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="id_username" name="username" placeholder="Username" required autofocus>
                <label for="id_username">Username</label>
            </div>

            <div class="form-floating mb-2 position-relative">
                <input type="password" class="form-control" id="id_password" name="password" placeholder="Password" required>
                <label for="id_password">Password</label>
                <button type="button" id="togglePassword" class="btn btn-outline-secondary btn-sm" style="position:absolute; right:10px; top:10px; z-index: 3;">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="btn btn-login" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="demo-info">
            <strong>Demo Credentials:</strong><br>
            <small>
                Admin: admin / password<br>
                Manager: manager / password<br>
                Viewer: viewer / password
            </small>
        </div>

        <div class="login-footer">
            <p>&copy; 2026 Inventory Management System</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const toggle = document.getElementById('togglePassword');
        const pwd = document.getElementById('id_password');
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        if (toggle && pwd) {
            toggle.addEventListener('click', function() {
                const isText = pwd.getAttribute('type') === 'text';
                pwd.setAttribute('type', isText ? 'password' : 'text');
                this.innerHTML = isText ? '<i class=\"fas fa-eye\"></i>' : '<i class=\"fas fa-eye-slash\"></i>';
            });
        }
        if (form && submitBtn) {
            form.addEventListener('submit', function() {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class=\"spinner-border spinner-border-sm\"></span> Signing In...';
            });
        }
    </script>
</body>
</html>
